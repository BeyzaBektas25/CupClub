services:
  postgres:
    image: postgres:15-alpine
    container_name: cupclub_db
    restart: always
    environment:
      POSTGRES_USER: cupclub_admin
      POSTGRES_PASSWORD: cupclub_password123
      POSTGRES_DB: cupclub_db
    ports:
      - "5433:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

